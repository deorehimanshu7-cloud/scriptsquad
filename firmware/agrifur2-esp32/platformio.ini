; AGRIFUR2 ESP32 — PlatformIO configuration
; Build:  pio run -t upload   (ESP32 board over USB)
; Status: reference firmware — CODE IMPLEMENTED, NOT PHYSICALLY TESTED here
;         (requires real ESP32 hardware + broker; see README.md in this folder)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21
build_flags =
    -DAGRIFUR_ADC_PIN=34      ; only if a soil-moisture probe is wired
    ; -DAGRIFUR_BATTERY_PIN=35 ; only if battery rail is wired
    ; -DAGRIFUR_TLS_CA_PATH=\"/ca.pem\"   ; TLS: store CA in LittleFS
upload_speed = 921600

# AGRIFUR — one-command full-stack deployment (SPA + API single process).
#
#   cp env.example .env          # optional: set keys (LLM, Copernicus, MQTT…)
#   docker compose up -d --build
#   → http://localhost:8787   (health: /api/health)
#
# SQLite is stored on the named volume `agrifur-data` — it survives rebuilds
# and container restarts. Secrets come from .env and stay server-side.

services:
  agrifur:
    build: .
    image: agrifur:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    environment:
      PORT: 8787
      NODE_ENV: production
      DATABASE_PATH: /app/apps/api/data/agrifur.db
    env_file:
      - path: .env
        required: false
    volumes:
      - agrifur-data:/app/apps/api/data
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||8787)+'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  agrifur-data:

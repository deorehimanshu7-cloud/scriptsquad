# ============================================================================
# AGRIFUR — Mosquitto MQTT broker configuration (DEVELOPMENT ONLY)
# ============================================================================
# Purpose: receive real telemetry from the ESP32 sensor node over the trusted
# local network (SIH prototype).
#
# Run it on the Windows development machine:
#   mosquitto -c agrifur-mosquitto.conf -v
# (or "mosquitto -c <full path> -v" if the config is not in the Mosquitto dir)
#
# IMPORTANT — SECURITY:
#   - This config listens on ALL interfaces (0.0.0.0:1883) with ANONYMOUS
#     access. That is acceptable ONLY on a trusted LAN for the prototype.
#   - DO NOT expose port 1883 to the public internet.
#   - Windows Firewall: allow inbound TCP 1883 ONLY on the Private/trusted
#     network profile:
#       netsh advfirewall firewall add rule name="AGRIFUR MQTT 1883 (LAN only)" dir=in action=allow protocol=TCP localport=1883 profile=private
#   - When the ESP32 cannot connect, first check that the Windows machine's
#     LAN IPv4 (ipconfig) is used in the firmware — never localhost/127.0.0.1
#     on the device.
# ============================================================================

# --- DEV broker (trusted LAN, anonymous) -----------------------------------
listener 1883 0.0.0.0
allow_anonymous true

# --- housekeeping ----------------------------------------------------------
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

max_connections -1
max_inflight_messages 20

# --- topic hygiene (nothing sensitive is accepted on other trees) ----------
# Deny everything outside the AGRIFUR tree by default, allow the device topics.
# Note: with allow_anonymous true and no acl_file, access is open; uncomment
# the ACL section below for a slightly safer LAN setup.
# acl_file agrifur-mosquitto.acl

# ============================================================================
# PRODUCTION HARDENING (uncomment + configure when moving beyond the LAN demo)
# ============================================================================
# 1) Disable anonymous access and use a password file:
#    allow_anonymous false
#    password_file C:\mosquitto\passwd
#    # create users:  mosquitto_passwd -c passwd agrifur_backend
#    #                mosquitto_passwd passwd AGRIFUR-ESP32-001
# 2) Restrict the broker to the trusted subnet only:
#    # listener 1883 192.168.1.0/24
# 3) TLS (recommended for any non-LAN link):
#    # listener 8883 0.0.0.0
#    # allow_anonymous false
#    # cafile   C:\mosquitto\certs\ca.crt
#    # certfile C:\mosquitto\certs\server.crt
#    # keyfile  C:\mosquitto\certs\server.key
# 4) Per-device topic authorization (example ACL):
#    # user AGRIFUR-ESP32-001
#    # topic write AGRIFUR/field/%u/#
#    # topic read AGRIFUR/field/%u/#
#    # user agrifur_backend
#    # topic read AGRIFUR/#
# ============================================================================